<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lee Solutions — Business card (print)</title>
<link rel="stylesheet" href="print.css">
<style>
@page{size:3.73622in 2.23622in;margin:0}
.card-bg-field{position:absolute;inset:0}
/* The delivered QR SVG has its own 4-module quiet zone baked in for
   standalone use; displaying that whole bordered file at 1in was shrinking
   the actual scannable pattern to ~0.76in and inflating the visible margin.
   This uses a border-free, pattern-only render at the true 1in, with the
   real 4-module quiet zone (0.16in) added here as ivory — not white — so
   it reads as the card stock itself rather than a separate white box. */
.qr-clearzone{background:var(--ivory);padding:0.16in;display:grid}
</style>
</head>
<body>

<!-- FRONT -->
<div class="sheet card-sheet card-front">
  <div class="card-bg"></div>
  <div class="card-bg-field" aria-hidden="true" id="card-ambient"></div>
  <div class="trim card-trim on-ink">
    <span class="pw-wordmark ivory" aria-label="Lee Solutions">
      <span class="top" style="font-size:19pt">LEE<span class="dot" style="width:0.06in;height:0.06in"></span></span>
      <span class="bottom" style="font-size:7pt">SOLUTIONS</span>
    </span>
    <div class="card-descriptor">Technology consulting for practical progress.</div>
  </div>
</div>

<!-- BACK -->
<div class="sheet card-sheet card-back">
  <div class="card-back-bg"></div>
  <div class="card-bg-field" aria-hidden="true" id="card-back-ambient"></div>
  <div class="trim card-trim">
    <div class="card-back-grid">
      <div class="card-back-left">
        <div>
          <div class="card-name">EngSean Lee</div>
          <div class="card-role">Founder</div>
        </div>
        <div class="card-contact-rows">
          <div class="row">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--sage-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8.6 3.6H5.5A2 2 0 0 0 3.5 5.7c.5 7.2 7.6 14.3 14.8 14.8a2 2 0 0 0 2.2-2v-3.1l-4-1.5-2 2.5a15.6 15.6 0 0 1-5.9-5.9l2.5-2z"/></svg>
            <span>785-588-2253</span>
          </div>
          <div class="row">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--sage-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.6 7 12 13.4 20.4 7"/></svg>
            <span>engsean@lee.solutions</span>
          </div>
          <div class="row">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--sage-700)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s6.5-6.2 6.5-10.4a6.5 6.5 0 0 0-13 0C5.5 14.8 12 21 12 21z"/><circle cx="12" cy="10.4" r="2.2"/></svg>
            <span>Topeka, Kansas</span>
          </div>
        </div>
      </div>
      <div class="card-back-right">
        <div class="qr-slot">
          <div class="qr-clearzone">
            <img src="qr/lee-solutions-business-card-qr-print.svg" width="1in" height="1in" style="width:1in;height:1in;display:block" alt="QR code — lee.solutions/card">
          </div>
          <span class="caption" style="max-width:1.1in">Scan to get in touch</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../site/js/ambient-loop.js"></script>
<script>
renderAmbientLoop(document.getElementById('card-ambient'), { paused: true, intensity: 0.6 });
/* Back is the front's composition in reverse: ivory instead of ink, so the
   champagne terminal nodes invert to ink and the connectors stay sage —
   the same graphic language, quieter, at rest on the light surface. */
renderAmbientLoop(document.getElementById('card-back-ambient'), {
  paused: true, intensity: 0.4,
  lineColor: 'var(--sage-700)', nodeColor: 'var(--ink-900)', gridColor: 'rgba(23,32,29,0.05)'
});
</script>
</body>
</html>
