    <path d="M-30 470C245 470 330 208 610 208S910 428 1230 428" stroke="#D8C6A5" stroke-opacity="0.54" stroke-width="2" stroke-dasharray="118 590" stroke-dashoffset="-340"/>
    <path d="M-30 142C205 142 292 372 565 372S900 164 1230 164" stroke="#D8C6A5" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="62 646" stroke-dashoffset="-510"/>
    <path d="M410 660C410 496 625 446 775 446S955 286 955-30" stroke="#829B88" stroke-opacity="0.58" stroke-width="2" stroke-dasharray="112 596" stroke-dashoffset="-210"/>
  </g>

  <g fill="#D8C6A5">
