    <circle cx="610" cy="208" r="7"/>
    <circle cx="565" cy="372" r="7"/>
    <circle cx="775" cy="446" r="6.5"/>
    <circle cx="660" cy="316" r="6.5"/>
  </g>

  <rect width="1200" height="630" fill="url(#scrim)"/>
  <rect width="1200" height="630" fill="url(#edge)"/>

  <!-- Cut-bar wordmark, matching components/brand/Wordmark.jsx -->
  <g transform="translate(78,38) scale(0.4)">
    <g fill="#F5F4EE">
      <rect x="0" y="0" width="9" height="100"/>
      <rect x="0" y="91" width="100" height="9"/>
      <rect x="204" y="0" width="104" height="9"/>
