<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Lee Solutions — Practical technology for Kansas businesses</title>
  <desc id="description">Lee Solutions wordmark and message over the brand's dark green grid and connector pattern.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#D8C6A5" stroke-opacity="0.09" stroke-width="1"/>
    </pattern>
    <radialGradient id="scrim" cx="0" cy="0" r="1" gradientTransform="translate(436 330) rotate(90) scale(395 620)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1310" stop-opacity="0.82"/>
      <stop offset="0.74" stop-color="#0D1310" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#0D1310" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17201D" stop-opacity="0"/>
      <stop offset="1" stop-color="#0D1310" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#17201D"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <g fill="none" stroke-linecap="round">
